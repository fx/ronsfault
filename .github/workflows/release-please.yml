name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  upload-addon-zip:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.release-please.outputs.version }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Build addon zip
        run: |
          mkdir -p staging/RonsFault
          # Always include the .toc itself
          cp RonsFault.toc staging/RonsFault/
          # Code files listed in the .toc (non-comment, non-metadata lines)
          grep -v '^#' RonsFault.toc | grep -v '^\s*$' | while read -r f; do
            cp "$f" staging/RonsFault/
          done
          # Assets from ## X-Assets metadata
          grep '^## X-Assets:' RonsFault.toc | sed 's/^## X-Assets://' | tr ',' '\n' | tr -d ' ' | while read -r f; do
            [ -n "$f" ] && cp "$f" staging/RonsFault/
          done
          cd staging
          zip -r "../RonsFault-${VERSION}.zip" RonsFault/

      - name: Upload zip to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG_NAME" "RonsFault-${VERSION}.zip" --clobber
